<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="JM — Jezreal Momoh Monogram">
  <!-- Background: Charcoal (#18181B) rounded square -->
  <rect width="64" height="64" rx="14" fill="#18181B" />
  <!-- Subtle Cobalt Blue (#2563EB) status/node accent dot in top-right -->
  <circle cx="50" cy="14" r="4.5" fill="#2563EB" />
  <!-- Crisp geometric 'JM' monogram in Warm Ivory (#FAF9F6) -->
  <text
    x="30"
    y="42"
    text-anchor="middle"
    fill="#FAF9F6"
    font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="-1"
  >JM</text>
</svg>
